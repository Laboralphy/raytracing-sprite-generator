<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sprite Viewer</title>
	<style>
		body { margin: 0; background: #111; color: #ccc; font: 14px sans-serif; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
		canvas { width: min(960px, 100%); image-rendering: pixelated; border: 1px solid #333; }
		.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
		select, input { background: #222; color: #ccc; border: 1px solid #444; padding: 2px 6px; }
		kbd { background: #222; border: 1px solid #444; padding: 0 4px; border-radius: 3px; }
	</style>
</head>
<body>
	<div class="bar">
		<label>Planche <input id="sheet" value="zombie" size="12"></label>
		<label>Animation <select id="anim"></select></label>
		<label><input id="spin" type="checkbox"> rotation auto</label>
		<span id="readout"></span>
	</div>
	<canvas id="screen" width="320" height="200"></canvas>
	<div><kbd>←</kbd> <kbd>→</kbd> tourner autour · <kbd>↑</kbd> <kbd>↓</kbd> distance · le personnage doit regarder vers la bande sombre du sol</div>
	<script type="module" src="./main.mjs"></script>
</body>
</html>
